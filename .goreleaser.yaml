project_name: tssh
before:
  hooks:
    - go mod tidy
builds:
  - id: tssh
    main: .
    binary: tssh
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X trzsz-ssh/tssh.kTsshVersion={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - loong64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
archives:
  - id: tssh
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macos_
      {{- else }}{{ .Os }}_{{ end }}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        format: zip
    files:
      - none*
nfpms:
  - id: tssh
    builds:
      - tssh
    section: net
    file_name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macos_
      {{- else }}{{ .Os }}_{{ end }}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    homepage: https://trzsz.github.io/tssh
    maintainer: Lonny Wong <lonnywong@qq.com>
    description: |
      tssh is a highly OpenSSH-compatible client with extended features.
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    rpm:
      group: Unspecified
snapshot:
  name_template: "{{ .Version }}.next"
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
