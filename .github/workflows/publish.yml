name: Release and publish trzsz-ssh

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-and-publish:
    name: Release and publish trzsz-ssh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trzsz-ssh
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v1"
          args: release --clean --skip=publish
      - name: Set up Go for Windows 7
        run: |
          wget -q https://github.com/thongtech/go-legacy-win7/releases/download/v1.25.7-1/go-legacy-win7-1.25.7-1.linux_amd64.tar.gz -O "$RUNNER_TEMP/go-legacy-win7.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go-legacy-win7.tar.gz"
      - name: Build Windows 7 compatibility binaries
        run: |
          export GOROOT="$RUNNER_TEMP/go-legacy-win7"
          export PATH="$GOROOT/bin:$PATH"
          go version
          version=${GITHUB_REF_NAME#v}
          mkdir -p tssh_${version}_win7_i386 tssh_${version}_win7_x86_64
          GOOS=windows GOARCH=386 go build -ldflags "-s -w -X trzsz-ssh/tssh.kTsshVersion=${version}" -o tssh_${version}_win7_i386/tssh.exe .
          zip -r tssh_${version}_win7_i386.zip tssh_${version}_win7_i386
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X trzsz-ssh/tssh.kTsshVersion=${version}" -o tssh_${version}_win7_x86_64/tssh.exe .
          zip -r tssh_${version}_win7_x86_64.zip tssh_${version}_win7_x86_64
      - name: Show Checksum
        run: |
          sha256sum dist/*.tar.gz dist/*.zip dist/*.rpm dist/*.deb dist/*_checksums.txt
          sha256sum ./*.zip
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rpm
            dist/*.deb
            dist/*_checksums.txt
            ./*.zip
      - name: Publish rpm to Gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
        run: |
          for filename in dist/tssh*.rpm; do
            curl -F package=@"$filename" https://{$FURY_TOKEN}@push.fury.io/trzsz/
          done
